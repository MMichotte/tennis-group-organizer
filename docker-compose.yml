version: '3.4'

services:
  tennis-organizer-app:
    image: mmichotte/tennis-organizer-app:latest
    container_name: tennis-organizer-app
    restart: unless-stopped
    ports:
      - 8080:8080
    healthcheck:
      test: curl --fail http://localhost:8080 || exit 1
      interval: 60s
      retries: 5
      start_period: 60s
      timeout: 10s
    